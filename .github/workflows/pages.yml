name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      # site.url / site.base_path in config.yml take effect when these are empty.
      # Override with repository variables ELIZA_SITE_URL / ELIZA_BASE_PATH if needed.
      - name: Build
        env:
          ELIZA_SITE_URL: ${{ vars.ELIZA_SITE_URL || steps.pages.outputs.origin }}
          ELIZA_BASE_PATH: ${{ vars.ELIZA_BASE_PATH || steps.pages.outputs.base_path }}
        run: bundle exec ruby build.rb

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
